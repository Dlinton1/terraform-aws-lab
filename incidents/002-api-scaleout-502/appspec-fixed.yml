version: 0.0
os: linux

hooks:

  BeforeInstall:
    - location: scripts/remove-symlinks.sh

  AfterInstall:
    - location: scripts/configure.sh

  ApplicationStop:
    - location: scripts/stop_server.sh

  ApplicationStart:
    - location: scripts/start_server.sh

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
