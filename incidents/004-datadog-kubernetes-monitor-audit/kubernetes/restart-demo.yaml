apiVersion: v1
kind: Namespace
metadata:
  name: monitor-audit-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: restart-demo
  namespace: monitor-audit-lab
  labels:
    app: restart-demo
spec:
  restartPolicy: Always
  containers:
    - name: restart-demo
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting monitoring test container"
          sleep 20
          echo "Exiting intentionally to generate restart telemetry"
          exit 1
